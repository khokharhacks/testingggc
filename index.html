<!DOCTYPE html>
<html>

<head>

<title>Sentinel OSINT Recon Dashboard</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

</head>


<body>


<div class="header">

<h1>🕵️ Sentinel OSINT Dashboard</h1>

<p>Open Source Intelligence Research Platform</p>

</div>



<div class="container">


<div class="panel">

<h2>Target Information</h2>


<label>Name</label>

<input id="name" placeholder="John Smith">


<label>Username</label>

<input id="username" placeholder="johnsmith">


<label>Email</label>

<input id="email" placeholder="john@email.com">


<button onclick="runRecon()">
Start Recon
</button>


</div>




<div id="output" class="panel">


<h2>Results</h2>

<p>Waiting for target...</p>


</div>



<div class="panel">

<h2>Relationship Map</h2>

<div id="graph"></div>


</div>



</div>



<script src="app.js"></script>

</body>

</html>
